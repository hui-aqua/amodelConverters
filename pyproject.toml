[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sim2blender"
version = "0.3.0"
description = "Aquaculture simulation visualization in Blender: AquaSim replay, cage physics and replaceable fish assets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib>=3.6"]

[project.scripts]
amodel-obj = "sim2blender.exporters.obj:main"
amodel-vtp = "sim2blender.exporters.vtp:main"
amodel-plot = "sim2blender.exporters.plot:main"

[tool.setuptools.packages.find]
where = ["src"]
